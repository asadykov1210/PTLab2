<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Добавление в корзину</title>
</head>
<body>
    <h2>Добавление товара в корзину</h2>

    <p>Товар: <strong>{{ product.name }}</strong></p>
    <p>Цена: {{ product.price }} руб.</p>

    <form method="post">
        {% csrf_token %}
        <label>Количество:</label>
        <input type="number" name="quantity" value="1" min="1" />
        <br /><br />
        <input type="submit" value="Продолжить" />
    </form>

    <p><a href="{% url 'index' %}">Вернуться в каталог</a></p>
</body>
</html>
