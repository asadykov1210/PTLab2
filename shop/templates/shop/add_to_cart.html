<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Добавить товар</title></head>
<body>
    <h2>Добавить «{{ product.name }}» в корзину</h2>
    <form method="post">
        {% csrf_token %}
        <label>Количество: <input type="number" name="quantity" value="1" min="1"></label>
        <button type="submit">Далее</button>
    </form>
</body>
</html>
