<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Подтверждение</title></head>
<body>
    <h2>Подтвердите добавление</h2>
    <p>Товар: {{ product.name }}</p>
    <p>Количество: {{ quantity }}</p>
    <p>Цена за единицу: {{ product.price }} руб.</p>
    <p><strong>Итого без скидки: {% widthratio product.price 1 quantity %} руб.</strong></p>
    <a href="{% url 'confirm_add' product.id %}?quantity={{ quantity }}">Подтвердить</a> |
    <a href="{% url 'index' %}">Отмена</a>
</body>
</html>
