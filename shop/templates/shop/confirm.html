<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Подтверждение покупки</title>
</head>
<body>
    <h2>Подтверждение покупки</h2>

    <p>Вы хотите купить <strong>{{ product.name }}</strong> в количестве <strong>{{ quantity }}</strong> шт?</p>

    <form action="{% url 'confirm_add' product.id %}" method="get">
        <input type="hidden" name="quantity" value="{{ quantity }}">
        <input type="submit" value="Да, добавить в корзину">
    </form>

    <p><a href="{% url 'index' %}">Отмена</a></p>
</body>
</html>
