<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Магазин</title></head>
<body>
    <h1>Каталог товаров</h1>
    <p>Ваша скидка: {{ discount }}% (куплено товаров: {{ purchases }})</p>
    <ul>
        {% for product in products %}
            <li>
                {{ product.name }} — {{ product.price }} руб.
                <a href="{% url 'add_to_cart' product.id %}">Добавить в корзину</a>
            </li>
        {% endfor %}
    </ul>
    <p>
        <a href="{% url 'cart' %}">Корзина</a> |
        <a href="{% url 'purchases' %}">Мои покупки</a> |
        <a href="{% url 'logout' %}">Выйти</a>
    </p>
</body>
</html>
